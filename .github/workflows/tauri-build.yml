name: Build and Release Tauri App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  WEB_ARTIFACTS_REPO: "indyzai/pos.pos-ui-new"

jobs:
  # ────────────────────────────────────────────────
  #   FAST COMPILE CHECK (Runs only on main branch)
  # ────────────────────────────────────────────────
  build-check:
    name: Fast Compile Check
    if: github.ref_type == 'branch' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Download web artifacts
        uses: ./.github/actions/download-web-artifacts
        continue-on-error: true
        with:
          repo: ${{ env.WEB_ARTIFACTS_REPO }}
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check compilation
        run: yarn tauri build --no-bundle

  # ────────────────────────────────────────────────
  #   DESKTOP BUILDS (Windows, Linux, macOS)
  # ────────────────────────────────────────────────
  build-desktop:
    name: Build Desktop ${{ matrix.platform }}
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
          - platform: linux
            os: ubuntu-22.04     # 22.04 usually more stable for webkitgtk
            bundles: deb,appimage
          - platform: macos
            os: macos-latest
            bundles: dmg
      
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Syncing version to $VERSION"
          jq ".version = \"$VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json
          jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Download web artifacts
        uses: ./.github/actions/download-web-artifacts
        with:
          repo: ${{ env.WEB_ARTIFACTS_REPO }}
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin   # optional — helps macOS universal

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
          # APPLE_CERTIFICATE etc. — if you want macOS signing via tauri-action
        #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Upload desktop artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────
  #   ANDROID BUILD
  # ────────────────────────────────────────────────
  build-android:
    name: Build Android
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Syncing version to $VERSION"
          jq ".version = \"$VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json
          jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Download web artifacts
        uses: ./.github/actions/download-web-artifacts
        with:
          repo: ${{ env.WEB_ARTIFACTS_REPO }}
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build requirements
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          NDK_PATH="$ANDROID_HOME/ndk/27.0.12077973"
          # Tauri checks NDK_HOME while other Android tooling checks the
          # ANDROID_NDK_* names. Set all of them so it cannot silently select
          # the runner's preinstalled NDK 29 instead of the tested NDK 27.
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Prepare Android signing (if secrets present)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > src-tauri/gen/android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > src-tauri/gen/android/app/keystore.properties
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> src-tauri/gen/android/app/keystore.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> src-tauri/gen/android/app/keystore.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> src-tauri/gen/android/app/keystore.properties

      - name: Build Android (APK + AAB)
        # Verbose output preserves the underlying Gradle/Kotlin error. Without
        # it Tauri only reports its outer "failed to assemble APK" wrapper.
        run: yarn tauri android build --target aarch64 --verbose

      - name: Upload Android artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Android bundle to Google Play
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.indyz.ai.pos
          releaseFiles: ${{ github.workspace }}/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          track: production
          status: completed

  # ────────────────────────────────────────────────
  #   PRE-FLIGHT CHECKS
  # ────────────────────────────────────────────────
  check-ios:
    name: Check if iOS build should run
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [[ "${{ vars.BUILD_IOS }}" == "true" ]] || [[ "${{ secrets.APPLE_TEAM_ID }}" != "" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  # ────────────────────────────────────────────────
  #   iOS BUILD (only on macOS runner!)
  # ────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    needs: [check-ios]
    if: needs.check-ios.outputs.should_run == 'true'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Syncing version to $VERSION"
          jq ".version = \"$VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json
          jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Download web artifacts
        uses: ./.github/actions/download-web-artifacts
        with:
          repo: ${{ env.WEB_ARTIFACTS_REPO }}
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup iOS/macOS signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build-password' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          printf "%s" "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          if [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            printf "%s" "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          else
            echo "Warning: APPLE_PROVISIONING_PROFILE_BASE64 is missing. iOS build might not be signed."
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build iOS
        run: yarn tauri ios build --release

      - name: Upload iOS artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/gen/apple/build/Release-iphoneos/*.ipa
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────
  #   PUBLISH RELEASE
  #   Runs after all build jobs to create / update
  #   the GitHub Release and mark it as non-draft.
  # ────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    if: |
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') &&
      needs.build-desktop.result == 'success' &&
      needs.build-android.result == 'success'
    needs: [build-desktop, build-android, build-ios]
    # build-ios has continue-on-error and may be skipped — that is fine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Indyz POS ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Indyz POS ${{ github.ref_name }}

            ### 📦 Included Artifacts
            | Platform | File(s) |
            | :--- | :--- |
            | 🪟 Windows | `.exe` (NSIS installer), `.msi` |
            | 🐧 Linux | `.deb`, `.AppImage` |
            | 🍎 macOS | `.dmg` |
            | 🤖 Android | `.apk`, `.aab` |
            | 📱 iOS | `.ipa` (if signing secrets are configured) |

            ### 🚀 What's Changed
            See the commit history or auto-generated release notes below.

            ### ⬇️ Installation
            Download the appropriate artifact for your platform from the assets below.
            - **Windows**: Run the `.exe` installer or deploy the `.msi` via group policy.
            - **macOS**: Open the `.dmg`, drag _Indyz POS_ to Applications.
            - **Linux**: Install the `.deb` or run the `.AppImage` directly.
            - **Android**: Side-load the `.apk` or distribute the `.aab` via Google Play.
            - **iOS**: Install the `.ipa` via TestFlight or your MDM.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
