[package]
name = "indyzai-pos-app"
version = "0.1.0"
description = "IndyzAI POS — Tauri Desktop/Mobile App"
authors = ["IndyzAI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "indyzai_pos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# OS keychain access (macOS Keychain, Windows Credential Manager, Linux libsecret)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Printing", "Win32_Foundation", "Win32_Security"] }
btleplug = "0.11"
tokio = { version = "1.40.0", features = ["full"] }
once_cell = "1.19"
rusqlite = { version = "0.32", features = ["bundled"] }
# Authentication-code exchange is performed by the native host so Android's
# WebView does not need a cross-origin browser request.
# We use rustls on all platforms (pure Rust, no OpenSSL required for cross-
# compilation to aarch64-android). The CA hang on Android is avoided by using
# bundled Mozilla WebPKI roots instead of scanning the system cert store.
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
# Bundled Mozilla root certificates — loaded explicitly in the reqwest client
# so Android's system-cert-store is never scanned (avoids 20-30 s hang).
webpki-roots = "0.26"
# Direct rustls access for building ClientConfig with bundled WebPKI roots.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
